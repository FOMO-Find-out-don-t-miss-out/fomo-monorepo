openapi: 3.0.0
info:
  title: FOMO API Service
  version: 0.0.0
tags: []
paths:
  /events:
    get:
      operationId: Events_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
  /events/{id}:
    get:
      operationId: Events_read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Event'
                  - $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      description: Standard error response
    Event:
      type: object
      required:
        - id
        - title
        - description
        - timestamp
        - lat
        - lng
      properties:
        id:
          type: string
          description: Unique identifier
        title:
          type: string
          description: Event title
        description:
          type: string
          description: Detailed description
        timestamp:
          type: string
          format: date-time
          description: UTC start time
        lat:
          type: number
          format: double
          description: Latitude
        lng:
          type: number
          format: double
          description: Longitude
      description: A real-time event discovery object

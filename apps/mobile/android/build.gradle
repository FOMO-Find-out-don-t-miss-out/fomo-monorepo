def resolveWorkletsDir() {
    try {
        // Χρησιμοποιούμε το node για να βρούμε το πακέτο μέσα στο monorepo
        def proc = ["node", "--print", "require.resolve('react-native-worklets-core/package.json')"].execute(null, rootDir)
        proc.waitFor()
        if (proc.exitValue() == 0) {
            return file(proc.text.trim()).getParentFile().getAbsolutePath()
        }
    } catch (Exception e) {
        // Fallback αν το node αποτύχει για οποιονδήποτε λόγο
    }
    return null
}

// Ορίζουμε την ιδιότητα στο rootProject ώστε να τη δεί το Reanimated
allprojects {
    project.ext.reactNativeWorkletsDir = resolveWorkletsDir()

    // Debug print για να είμαστε σίγουροι στο επόμενο build
    if (project.name == "app") {
        println "🧬 Worklets Core Path: ${project.ext.reactNativeWorkletsDir}"
    }
}


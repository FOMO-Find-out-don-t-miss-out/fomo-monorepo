// Propagate custom Ninja (1.12+) and extended CMAKE_OBJECT_PATH_MAX to EVERY
// Android subproject (third-party native modules like react-native-worklets,
// react-native-reanimated). Without this, their CMake invocations fall back to
// the Android SDK's bundled Ninja 1.10 and the 250-char object-path cap,
// producing "manifest 'build.ninja' still dirty after 100 tries" on Windows
// monorepos where pnpm paths are long.
subprojects { proj ->
    def applyCmakeFlags = {
        def cmakeArgs = proj.android.defaultConfig.externalNativeBuild.cmake.arguments
        if (!cmakeArgs.any { it.toString().startsWith('-DCMAKE_MAKE_PROGRAM=') }) {
            cmakeArgs.add('-DCMAKE_MAKE_PROGRAM=C:/ninja/ninja.exe')
        }
        if (!cmakeArgs.any { it.toString().startsWith('-DCMAKE_OBJECT_PATH_MAX=') }) {
            cmakeArgs.add('-DCMAKE_OBJECT_PATH_MAX=1024')
        }
    }
    proj.plugins.withId('com.android.library')     { applyCmakeFlags() }
    proj.plugins.withId('com.android.application') { applyCmakeFlags() }
}
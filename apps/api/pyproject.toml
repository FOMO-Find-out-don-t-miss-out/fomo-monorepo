[project]
name = "fomo-api"
version = "0.1.0"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.23.0",
    "sqlmodel>=0.0.22",
    "redis>=5.0.8",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "geoalchemy2>=0.15.2",
    "psycopg2-binary>=2.9.9",
    "instructor",
    "openai>=1.0.0",
    "google-genai",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.0.0",
    "shapely>=2.0.6",
    "alembic>=1.13.3",
    "domain",
    "jsonref>=1.1.0",
    "PyJWT[crypto]>=2.9.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[tool.uv]
package = false

[tool.uv.sources]
domain = { workspace = true }

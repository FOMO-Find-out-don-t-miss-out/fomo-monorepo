[project]
name = "fomo-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.23.0",
    "sqlmodel>=0.0.22",
    "redis>=5.0.8",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "geoalchemy2>=0.15.2",
    "psycopg2-binary>=2.9.9",
    "instructor",
    "google-genai",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.0.0",
    "shapely>=2.0.6",
    "alembic>=1.13.3",
    "domain",
]

[tool.uv]
package = false

[tool.uv.sources]
domain = { workspace = true }
